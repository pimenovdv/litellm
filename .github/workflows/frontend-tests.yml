name: Frontend Unit Tests
on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/litellm-dashboard/package-lock.json'
      - name: Install dependencies
        working-directory: ./frontend/litellm-dashboard
        run: npm ci
      - name: Run tests
        working-directory: ./frontend/litellm-dashboard
        run: npm run test
