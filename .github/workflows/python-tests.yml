name: Backend Unit Tests
on:
  pull_request:
    paths:
      - 'Backend/**'
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.15"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ./Backend
        run: uv sync
      - name: Run tests
        working-directory: ./Backend
        run: uv run pytest tests/
