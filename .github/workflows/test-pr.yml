name: PR Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Backend/requirements.txt
        pip install fastapi starlette pytest-asyncio pydantic-settings pytest python-multipart python-dotenv pytest-cov pytest-mock respx vcrpy pytest-recording
    - name: Run proxy pre call tests
      run: |
        PYTHONPATH=Backend:./ python -m pytest tests/test_litellm/proxy/test_litellm_pre_call_utils.py -v
