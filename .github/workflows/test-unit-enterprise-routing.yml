name: "Unit Tests: Enterprise, Google GenAI & Routing"

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enterprise-routing:
    uses: ./.github/workflows/_test-unit-base.yml
    with:
      test-path: >-
        tests/unit/enterprise
        tests/unit/google_genai
        tests/unit/router_utils
        tests/unit/router_strategy
      workers: 2
      reruns: 2
      artifact-name: enterprise-routing
