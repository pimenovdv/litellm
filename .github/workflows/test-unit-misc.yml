name: "Unit Tests: MCP, Secrets, Containers & Misc"

on:
  pull_request:
    branches:
      - litellm_internal_staging
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  misc:
    uses: ./.github/workflows/_test-unit-base.yml
    with:
      test-path: >-
        tests/unit/batches
        tests/unit/secret_managers
        tests/unit/a2a_protocol
        tests/unit/anthropic_interface
        tests/unit/completion_extras
        tests/unit/containers
        tests/unit/experimental_mcp_client
        tests/unit/models
        tests/unit/repositories
        tests/unit/images
        tests/unit/interactions
        tests/unit/ocr
        tests/unit/passthrough
        tests/unit/sandbox
        tests/unit/vector_stores
        tests/unit/videos
        tests/unit/test_*.py
      workers: 2
      reruns: 2
      artifact-name: misc
