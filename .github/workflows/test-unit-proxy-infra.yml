name: "Unit Tests: Proxy Infrastructure"

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proxy-infra:
    uses: ./.github/workflows/_test-unit-base.yml
    with:
      test-path: >-
        tests/unit/proxy/db
        tests/unit/proxy/middleware
        tests/unit/proxy/spend_tracking
        tests/unit/proxy/pass_through_endpoints
        tests/unit/proxy/_experimental
        tests/unit/proxy/experimental
        tests/unit/proxy/common_utils
        tests/unit/proxy/logging_endpoints
        tests/unit/proxy/test_*.py
      workers: 2
      reruns: 2
      artifact-name: proxy-infra
