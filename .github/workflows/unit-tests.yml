name: Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system -e Backend/
        pip install pytest pytest-asyncio pytest-cov aiohttp httpx pydantic openai pyyaml tiktoken python-dotenv fastapi fastapi-cli tokenizers mock fastuuid respx pytest-mock jinja2
    - name: Run unit tests with coverage
      run: |
        PYTHONPATH=Backend:./ pytest -m unit tests/unit/ --cov=Backend/
        # Not failing on coverage under 90% yet since we are in early migration phases
