version: '3.8'

services:
  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/litellm
      - REDIS_URL=redis://redis:6379/0
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./ui/litellm-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:4000
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=litellm
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
